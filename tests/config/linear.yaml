# yaml-language-server: $schema=../../bindings/pylucid/configuration_schema.json
b_norm: 2.0
estimator: KernelRidgeRegressor
feature_map: LinearTruncatedFourierFeatureMap
feature_sigma_l: 0.0925
gamma: 1.0
kernel: GaussianKernel
lambda: 1.0e-5
lattice_resolution: 300
noise_scale: 0.01
num_frequencies: 6
num_samples: 1000
optimiser: HighsOptimiser
plot: true
seed: 42
set_scaling: 0.04000000000000001
sigma_f: 1.0
sigma_l: 0.04465750366442458
system_dynamics: [x1 / 2]
time_horizon: 15
verbose: 3
X_bounds:
  - RectSet:
      - [-1, 1]
X_init:
  - RectSet:
      - [-0.5, 0.5]
X_unsafe:
  - RectSet:
      - [-1, -0.9]
  - RectSet:
      - [0.9, 1]
