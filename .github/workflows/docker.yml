name: Docker CI

on:
  push:
    branches: [main]
    paths:
      - "lucid/**"
      - "bindings/**"
      - "tools/**"
      - "third_party/**"
      - "*.bazel*"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
    tags:
      - "*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract metadata (tags, labels) for Docker (light)
        id: meta-light
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-light

      - name: Build and push Docker image (light)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.light
          push: true
          tags: ${{ steps.meta-light.outputs.tags }}
          labels: ${{ steps.meta-light.outputs.labels }}