name: Docs CI

on:
  push:
    branches: [main]
    paths:
      - "lucid/**"
      - "docs/**"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: ./.github/actions/bazel-cache

      - name: Install Doxygen
        run: sudo apt-get install graphviz -y

      - name: Generate Doxygen Documentation
        run: bazel build //docs

      - name: Generate demo
        run: |
          bazel build //frontend --config=js
          chmod +w bazel-out/k8-opt/bin/frontend/dist/assets/
          cp bazel-out/k8-opt/bin/bindings/jslucid/main_wasm/* bazel-out/k8-opt/bin/frontend/dist/assets/

      - name: Create .nojekyll (ensures pages with underscores work on gh pages)
        run: |
          chmod +w bazel-out/k8-fastbuild/bin/docs/html/
          mkdir -p bazel-out/k8-fastbuild/bin/docs/html/demo
          cp -r bazel-out/k8-opt/bin/frontend/dist/* bazel-out/k8-fastbuild/bin/docs/html/demo/
          touch bazel-out/k8-fastbuild/bin/docs/html/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "bazel-out/k8-fastbuild/bin/docs/html"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
